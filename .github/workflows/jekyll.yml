name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.deployment.outputs.page_url }}"

      - name: Verify test files are excluded
        run: |
          for path in .github AGENTS.md TODO.md blob-report coverage e2e eslint.config.js mise.toml node_modules .nyc_output package.json package-lock.json playwright.config.js playwright-report test-results tests vitest.config.js worker; do
            if [ -e "_site/$path" ]; then
              echo "::error::_site/$path must not be included in the Pages artifact"
              exit 1
            fi
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
