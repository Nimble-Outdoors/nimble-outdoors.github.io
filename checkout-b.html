---
layout: landing
title: "Nimble Outdoors - Choose &amp; Checkout"
description: "Choose your pack and complete your preorder"
---

<section class="checkout-section">
  <div class="container">
    <h2>Choose Your Pack &amp; Checkout</h2>
    <div class="checkout-grid">
      <div class="checkout-selector">
        <div class="checkout-pack-cards" id="packCards">
        </div>
      </div>
      <div class="checkout-payment">
        <div class="checkout-selected-details" id="selectedDetails">
          <div class="checkout-selected-sticks" id="selectedSticks"></div>
          <div class="checkout-selected-info">
            <div class="checkout-selected-stats">
              <div class="checkout-selected-stat">
                <span class="checkout-selected-stat-value" id="selSticks">4</span>
                <span class="checkout-selected-stat-label">Sticks</span>
              </div>
              <div class="checkout-selected-stat">
                <span class="checkout-selected-stat-value" id="selWeight">3 lb 4 oz</span>
                <span class="checkout-selected-stat-label">Total Weight</span>
              </div>
              <div class="checkout-selected-stat">
                <span class="checkout-selected-stat-value" id="selClimb">~16 ft</span>
                <span class="checkout-selected-stat-label">Climb Height</span>
              </div>
            </div>
            <div class="checkout-selected-total">
              <span class="checkout-selected-total-label">Total</span>
              <span class="checkout-selected-total-price" id="selPrice">$249</span>
            </div>
          </div>
        </div>
        <form id="checkoutForm">
          <div id="checkoutResults"></div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" required>
          </div>

          <fieldset class="shipping-fieldset">
            <legend>Shipping Address</legend>
            <div class="form-group">
              <label for="ship-name">Full Name</label>
              <input type="text" id="ship-name" required>
            </div>
            <div class="form-group">
              <label for="ship-address">Address Line 1</label>
              <input type="text" id="ship-address" required>
            </div>
            <div class="form-group">
              <label for="ship-address2">Address Line 2 (optional)</label>
              <input type="text" id="ship-address2">
            </div>
            <div class="form-row">
              <div class="form-group form-group-half">
                <label for="ship-city">City</label>
                <input type="text" id="ship-city" required>
              </div>
              <div class="form-group form-group-quarter">
                <label for="ship-state">State</label>
                <input type="text" id="ship-state" required>
              </div>
              <div class="form-group form-group-quarter">
                <label for="ship-zip">ZIP Code</label>
                <input type="text" id="ship-zip" required>
              </div>
            </div>
          </fieldset>

          <div id="stripe-payment-element" style="margin-bottom:24px">
          </div>

          <button type="submit" id="submit-btn" class="btn btn-primary">
            Pay $249.00
          </button>
        </form>
      </div>
    </div>
  </div>
</section>

<script src="https://js.stripe.com/v3/"></script>
<script type="module">
  import {
    WORKER_URL, STRIPE_PK, renderStickIcons,
    getConfirmPaymentOutcome, validateEmail, getShippingFields,
    buildShippingAddress, createPaymentAppearance, createPaymentFields,
    renderSuccessConfirmation, setSubmitButton, initCheckout, showError
  } from '/assets/js/checkout.js'

  var packs = [];
  var selectedIndex = 1;
  var stripe, form, submitBtn, resultEl, emailInput;

  function buildPackCards() {
    var container = document.getElementById("packCards");
    packs.forEach(function(pack, i) {
      var card = document.createElement("div");
      card.className = "checkout-pack-card" + (i === selectedIndex ? " checkout-pack-card--selected" : "");
      card.dataset.index = i;
      card.innerHTML =
        '<div class="checkout-pack-visual">' +
          Array(pack.sticks).fill('<span class="checkout-pack-dot"></span>').join('') +
        '</div>' +
        '<h3 class="checkout-pack-name">' + pack.name + '</h3>' +
        '<p class="checkout-pack-price">$' + pack.price + '</p>' +
        '<p class="checkout-pack-desc">' + pack.desc + '</p>' +
        '<div class="checkout-pack-check">&#10003;</div>';
      card.addEventListener("click", function() { selectPack(parseInt(this.dataset.index)); });
      container.appendChild(card);
    });
  }

  function selectPack(index) {
    selectedIndex = index;
    var pack = packs[index];

    document.querySelectorAll(".checkout-pack-card").forEach(function(el) {
      el.classList.toggle("checkout-pack-card--selected", parseInt(el.dataset.index) === index);
    });

    setSubmitButton(submitBtn, pack);

    document.getElementById("selSticks").textContent = pack.sticks;
    document.getElementById("selWeight").textContent = pack.weight;
    document.getElementById("selClimb").textContent = pack.climb;
    document.getElementById("selPrice").textContent = "$" + pack.price;

    renderStickIcons(document.getElementById("selectedSticks"), pack.sticks, "checkout-stick-icon");
  }

  async function init() {
    resultEl = document.getElementById("checkoutResults");
    submitBtn = document.getElementById("submit-btn");
    form = document.getElementById("checkoutForm");

    resultEl.innerHTML = '<p style="color:#ccc">Loading…</p>';
    submitBtn.disabled = true;

    var data;
    try {
      data = await initCheckout(selectedIndex + 1);
      packs = data.packs;
    } catch (err) {
      showError(resultEl, 'Pricing currently unavailable. Please try again later.');
      return;
    }

    buildPackCards();
    selectPack(selectedIndex);

    stripe = Stripe(STRIPE_PK);
    emailInput = document.getElementById("email");

    resultEl.innerHTML = '<p style="color:#ccc">Setting up payment form…</p>';

    try {
      var pack = packs[selectedIndex];
      var clientSecret = data.clientSecret;

      var elements = stripe.elements({ clientSecret: clientSecret, appearance: createPaymentAppearance() });
      var paymentElement = elements.create('payment', createPaymentFields());
      paymentElement.mount('#stripe-payment-element');
      resultEl.innerHTML = '';

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        submitBtn.disabled = true;
        submitBtn.textContent = 'Processing…';

        var pack = packs[selectedIndex];
        var email = emailInput.value;

        if (!email || !validateEmail(email)) {
          showError(resultEl, 'Please enter a valid email address so we can send your receipt.');
          emailInput.focus();
          setSubmitButton(submitBtn, pack);
          return;
        }

        var fields = getShippingFields();
        if (!fields.name || !fields.address || !fields.city || !fields.state || !fields.zip) {
          showError(resultEl, 'Please fill in all required shipping fields.');
          setSubmitButton(submitBtn, pack);
          return;
        }

        try {
          var confirmResult = await stripe.confirmPayment({
            elements: elements,
            redirect: 'if_required',
            confirmParams: {
              return_url: WORKER_URL + '/confirm',
              receipt_email: email,
              payment_method_data: {
                billing_details: {
                  name: fields.name,
                  email: email,
                  phone: '',
                  address: {
                    line1: fields.address,
                    city: fields.city,
                    state: fields.state,
                    postal_code: fields.zip,
                    country: 'US',
                  },
                },
              },
              shipping: {
                name: fields.name,
                address: buildShippingAddress(fields),
              },
            },
          });

          var outcome = getConfirmPaymentOutcome(confirmResult);
          if (outcome.type === 'error') {
            showError(resultEl, outcome.message);
            setSubmitButton(submitBtn, pack);
          } else if (outcome.type === 'success') {
            document.getElementById('stripe-payment-element').innerHTML = '';
            renderSuccessConfirmation(form, email);
          }
        } catch (err) {
          showError(resultEl, err.message);
          setSubmitButton(submitBtn, pack);
        }
      });
    } catch (err) {
      showError(resultEl, err.message);
    }
  }

  init();
</script>
