---
layout: default
title: "Nimble Outdoors - Checkout"
description: "Complete your order for Nimble Climbing Sticks"
---

<section class="checkout-section">
  <div class="container">
    <h2>Checkout</h2>
    <div class="checkout-grid">
      <div class="checkout-summary">
        <h3>Your Order</h3>
        <div class="checkout-product-card">
          <div class="checkout-order-visual">
            <img src="/assets/images/mach_one_logo.png" alt="Mach One Logo" class="checkout-order-logo">
            <img src="/assets/images/mach-one-single-full-stick.png" alt="Nimble Mach One Climbing Stick" class="checkout-order-image">
          </div>
          <div class="checkout-product-info">
            <h4 id="cartName">Nimble Climbing Sticks — {{ site.data.packs[1].name }}</h4>
            <p class="checkout-product-price loading-shimmer loading-shimmer--lg" id="cartPrice"></p>
            <ul class="checkout-product-specs" id="cartSpecs">
              <li><strong>{{ site.data.packs[1].sticks }}</strong> carbon fiber sticks</li>
            </ul>
          </div>
        </div>
      </div>
      <div class="checkout-payment">
        <form id="checkoutForm">


          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" required>
          </div>

          <fieldset class="shipping-fieldset">
            <legend>Shipping Address</legend>
            <div class="form-group">
              <label for="ship-name">Full Name</label>
              <input type="text" id="ship-name" required>
            </div>
            <div class="form-group">
              <label for="ship-address">Address Line 1</label>
              <input type="text" id="ship-address" required>
            </div>
            <div class="form-group">
              <label for="ship-address2">Address Line 2 (optional)</label>
              <input type="text" id="ship-address2">
            </div>
            <div class="form-row">
              <div class="form-group form-group-half">
                <label for="ship-city">City</label>
                <input type="text" id="ship-city" required>
              </div>
              <div class="form-group form-group-quarter">
                <label for="ship-state">State</label>
                <input type="text" id="ship-state" required>
              </div>
              <div class="form-group form-group-quarter">
                <label for="ship-zip">ZIP Code</label>
                <input type="text" id="ship-zip" required>
              </div>
            </div>
          </fieldset>

          <div class="promo-section">
            <div class="form-group">
              <label for="promo-code">Promo Code</label>
              <div class="promo-input-row">
                <input type="text" id="promo-code" placeholder="Enter code">
                <button type="button" id="promo-apply-btn" class="btn btn-secondary">Apply</button>
              </div>
            </div>
            <div id="promo-status"></div>
          </div>

          <div id="paymentError"></div>
          <div id="stripe-payment-element" style="margin-bottom:24px">
          </div>

          <button type="submit" id="submit-btn" class="btn btn-primary">
            Pay <span class="loading-shimmer loading-shimmer--btn" id="submitBtnPrice"></span>
          </button>
        </form>
      </div>
    </div>
  </div>
</section>

<script id="pack-data" type="application/json">{{ site.data.packs | jsonify }}</script>
<script src="https://js.stripe.com/v3/"></script>
<script type="module">
  import {
    STRIPE_PK, getPackDetails, mergePackData, getSpecsHtml, renderStickIcons,
    getConfirmPaymentOutcome, validateEmail, getShippingFields,
    buildShippingAddress, createPaymentAppearance, createPaymentFields,
    renderSuccessConfirmation, renderTestModeBanner, setSubmitButton, initCheckout, showError
  } from '/assets/js/checkout.js'

  function readPackIndex() {
    const params = new URLSearchParams(window.location.search)
    const n = parseInt(params.get('pack')) || 2
    return (n >= 1 && n <= getPackDetails().length) ? n : 2
  }

  function handleRedirect(packIndex) {
    const params = new URLSearchParams(window.location.search)
    const clientSecret = params.get('payment_intent_client_secret')
    if (!clientSecret) return false

    const redirectStatus = params.get('redirect_status')
    const stripe = Stripe(STRIPE_PK)
    stripe.retrievePaymentIntent(clientSecret).then(function (result) {
      const pi = result.paymentIntent
      if (pi?.status === 'succeeded') {
        document.getElementById('stripe-payment-element').innerHTML = ''
        renderSuccessConfirmation(document.getElementById('checkoutForm'), pi.receipt_email || 'your email')
      } else if (redirectStatus && redirectStatus !== 'succeeded') {
        showError(document.getElementById('paymentError'), 'Payment could not be processed. Please try again with a different card.')
      }
      history.replaceState({}, '', window.location.pathname + '?pack=' + packIndex)
    })
    return true
  }

  function renderOrderSummary(pack, discountInfo) {
    document.getElementById('cartName').textContent = 'Nimble Climbing Sticks \u2014 ' + pack.name
    document.getElementById('cartPrice').classList.remove('loading-shimmer', 'loading-shimmer--lg')
    if (discountInfo) {
      updatePriceDisplay(pack, discountInfo)
    } else {
      document.getElementById('cartPrice').textContent = '$' + pack.price.toFixed(2)
    }
    document.getElementById('cartSpecs').innerHTML = getSpecsHtml(pack)
  }

  function updatePriceDisplay(pack, discount) {
    const priceEl = document.getElementById('cartPrice')
    priceEl.classList.remove('loading-shimmer', 'loading-shimmer--lg')
    if (discount) {
      const discounted = pack.price - discount.amount
      priceEl.innerHTML =
        '<span style="text-decoration:line-through;opacity:0.5;margin-right:10px">$' + pack.price.toFixed(2) + '</span> ' +
        '<span style="color:#4CAF50">$' + discounted.toFixed(2) + '</span>'
    } else {
      priceEl.textContent = '$' + pack.price.toFixed(2)
    }
  }

  async function init() {
    renderTestModeBanner()
    const paymentErrorEl = document.getElementById('paymentError')
    const submitBtn = document.getElementById('submit-btn')
    const form = document.getElementById('checkoutForm')
    const packIndex = readPackIndex()

    if (handleRedirect(packIndex)) return

    paymentErrorEl.innerHTML = '<p style="color:#ccc">Loading…</p>'
    submitBtn.disabled = true

    let packs, clientSecret, discountInfo
    try {
      const data = await initCheckout(packIndex)
      packs = mergePackData(data.packs)
      clientSecret = data.clientSecret
    } catch (err) {
      const msg = err.name === 'AbortError'
        ? 'Request timed out. Please check your connection and try again.'
        : 'Pricing currently unavailable. Please try again later.'
      showError(paymentErrorEl, msg)
      return
    }

    let pack = packs[packIndex - 1]
    renderOrderSummary(pack, discountInfo)

    const stripe = Stripe(STRIPE_PK)
    const emailInput = document.getElementById('email')
    const promoInput = document.getElementById('promo-code')
    const promoApplyBtn = document.getElementById('promo-apply-btn')
    const promoStatus = document.getElementById('promo-status')
    let elements, paymentElement

    function mountPaymentElement(secret) {
      if (paymentElement) paymentElement.destroy()
      elements = stripe.elements({ clientSecret: secret, appearance: createPaymentAppearance() })
      paymentElement = elements.create('payment', createPaymentFields())
      paymentElement.mount('#stripe-payment-element')
    }

    setSubmitButton(submitBtn, pack)
    paymentErrorEl.innerHTML = '<p style="color:#ccc">Setting up payment form…</p>'

    promoApplyBtn.addEventListener('click', async function () {
      const code = promoInput.value.trim()
      if (!code) return
      promoApplyBtn.disabled = true
      promoApplyBtn.textContent = 'Applying…'
      promoStatus.innerHTML = ''
      try {
        const data = await initCheckout(packIndex, undefined, code)
        clientSecret = data.clientSecret
        discountInfo = data.discount || null
        pack = mergePackData(data.packs)[packIndex - 1]

        mountPaymentElement(clientSecret)
        updatePriceDisplay(pack, discountInfo)
        setSubmitButton(submitBtn, pack, discountInfo)

        if (discountInfo) {
          promoStatus.innerHTML = '<p style="color:#4CAF50;font-size:0.85rem;margin:4px 0 0">Promo applied: ' + discountInfo.label + '</p>'
          promoInput.disabled = true
          promoApplyBtn.textContent = 'Applied'
        } else {
          promoStatus.innerHTML = '<p style="color:#ff6b6b;font-size:0.85rem;margin:4px 0 0">Code could not be applied.</p>'
        }
      } catch (err) {
        promoStatus.innerHTML = '<p style="color:#ff6b6b;font-size:0.85rem;margin:4px 0 0">' + err.message + '</p>'
        promoApplyBtn.disabled = false
        promoApplyBtn.textContent = 'Apply'
      }
    })

    try {
      mountPaymentElement(clientSecret)
      paymentErrorEl.innerHTML = ''

      form.addEventListener('submit', async function (e) {
        e.preventDefault()
        submitBtn.disabled = true
        submitBtn.textContent = 'Processing…'

        const email = emailInput.value
        if (!email || !validateEmail(email)) {
          showError(paymentErrorEl, 'Please enter a valid email address so we can send your receipt.')
          emailInput.focus()
          setSubmitButton(submitBtn, pack, discountInfo)
          return
        }

        const fields = getShippingFields()
        if (!fields.name || !fields.address || !fields.city || !fields.state || !fields.zip) {
          showError(paymentErrorEl, 'Please fill in all required shipping fields.')
          setSubmitButton(submitBtn, pack, discountInfo)
          return
        }
        try {
          const confirmResult = await stripe.confirmPayment({
            elements: elements,
            redirect: 'if_required',
            confirmParams: {
              return_url: window.location.origin + window.location.pathname + '?pack=' + packIndex,
              receipt_email: email,
              payment_method_data: {
                billing_details: {
                  name: fields.name,
                  email: email,
                  phone: '',
                  address: {
                    line1: fields.address,
                    city: fields.city,
                    state: fields.state,
                    postal_code: fields.zip,
                    country: 'US',
                  },
                },
              },
              shipping: {
                name: fields.name,
                address: buildShippingAddress(fields),
              },
            },
          })

          const outcome = getConfirmPaymentOutcome(confirmResult)
          if (outcome.type === 'error') {
            setSubmitButton(submitBtn, pack, discountInfo)
          } else if (outcome.type === 'success') {
            document.getElementById('stripe-payment-element').innerHTML = ''
            renderSuccessConfirmation(form, email)
          } else {
            showError(paymentErrorEl, 'Payment could not be completed. Please try again.')
            setSubmitButton(submitBtn, pack, discountInfo)
          }
        } catch (err) {
          showError(paymentErrorEl, err.message)
          setSubmitButton(submitBtn, pack, discountInfo)
        }
      })
    } catch (err) {
      showError(paymentErrorEl, err.message)
    }
  }

  init()
</script>
